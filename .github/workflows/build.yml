name: Windows EXE Derlemesi

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: .NET 8 kurulumu
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: EXE oluştur
        run: >
          dotnet publish MarasalBossTakip.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: ZIP oluştur
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath MarasalBossTakip-Windows-x64.zip

      - name: EXE ve ZIP yükle
        uses: actions/upload-artifact@v4
        with:
          name: MarasalBossTakip-Windows-x64
          path: MarasalBossTakip-Windows-x64.zip
